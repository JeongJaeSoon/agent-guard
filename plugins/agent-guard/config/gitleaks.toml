# A test description names a numbered stand-in credential (`dummy-key-12345`,
# `example_token-123456`). The global placeholder entries above end in an
# alphanumeric run, so they stop at the separator before the number (#599).
# Anchored to the whole secret, with no prefix: dummy or example, a credential
# word, then `-` or `_` and 1 to 12 digits, nothing after. Only
# generic-api-key is targeted, so a vendor rule (a Google API key that embeds
# the same text) keeps its finding.
[[allowlists]]
description = "Numbered dummy and example credentials (#599)"
targetRules = ["generic-api-key"]
regexes = [
  '''(?i)^(?:dummy|example)[_-]?(?:token|key|secret|password)[_-][0-9]{1,12}$'''
]

# Directory scans skip these exact lockfile names, then agent-guard rescans
# their non-checksum content through stdin. This avoids checksum false positives
# without allowing credentials elsewhere in a lockfile.
[[allowlists]]
description = "Lockfiles rescanned after exact checksum fields are removed"
paths = [
  '''(^|/)(go\.sum|package-lock\.json|yarn\.lock|Cargo\.lock|uv\.lock)$'''
]
