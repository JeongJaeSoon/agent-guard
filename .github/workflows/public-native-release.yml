name: Public native release validation
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published X.Y.Z release to validate
        required: true
        type: string
      previous_version:
        description: Published release to upgrade from
        required: true
        type: choice
        default: '3.7.1'
        options: ['3.6.14', '3.6.15', '3.7.0', '3.7.1']
permissions:
  contents: read
jobs:
  public:
    name: Public install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install scanner and jq
        run: sh scripts/install-native-test-tools.sh "$RUNNER_TEMP/test-bin"
      - name: Verify published installs without a Rust compiler
        env:
          VERSION: ${{ inputs.version }}
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
        run: |
          export PATH="$RUNNER_TEMP/test-bin:/usr/bin:/bin:/usr/sbin:/sbin"
          sh tests/public-native-release.sh "$VERSION" "$RUNNER_TEMP/public-evidence" "$PREVIOUS_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: public-${{ matrix.os }}
          path: ${{ runner.temp }}/public-evidence/
          if-no-files-found: error
  homebrew:
    name: Public Homebrew (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Expose preinstalled Linux Homebrew
        if: runner.os == 'Linux'
        run: echo '/home/linuxbrew/.linuxbrew/bin' >> "$GITHUB_PATH"
      - name: Verify public formula upgrade and canonical tap install
        env:
          VERSION: ${{ inputs.version }}
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
        run: sh tests/public-native-homebrew.sh "$VERSION" "$RUNNER_TEMP/homebrew-evidence" "$PREVIOUS_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: public-homebrew-${{ matrix.os }}
          path: ${{ runner.temp }}/homebrew-evidence/
          if-no-files-found: error
