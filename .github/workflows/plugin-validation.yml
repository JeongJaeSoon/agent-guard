name: Plugin Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  plugin-validation:
    name: Plugin Layout
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step after checkout authenticates to Git, so do not persist the
          # GITHUB_TOKEN in the local git config.
          persist-credentials: false

      # No test suite here: ci.yml already runs tests/run.sh on the same
      # triggers across ubuntu and macos. This job owns what runs nowhere else.
      - name: Validate Plugin Layouts and Release Archive
        # --all runs the same Codex, Claude, marketplace, and archive checks
        # in one invocation, with one shared temporary directory.
        run: scripts/validate-plugin-layout.sh --all

      - name: Validate Plugin Disclosures and Marketplace Metadata
        # Routine PR validation covers stable manifests, disclosure, and the
        # placeholder template. A concrete catalog SHA is rendered only from
        # the merged main checkout when an actual submission requests it.
        run: make submission-check
