name: Native platform artifacts
on:
  # Release consumes only the main push run; pull requests run this only
  # when they change what the native, install or packaged jobs execute.
  pull_request:
    paths:
      - '.github/workflows/native-platforms.yml'
      - 'native/**'
      - 'bench/native/**'
      - 'bench/fused-output/**'
      - 'plugins/agent-guard/**'
      - 'scripts/**'
      - 'tests/**'
      - 'bootstrap.sh'
      - 'install.sh'
      - 'deployment/**'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  platform:
    name: Native execution (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        timeout-minutes: 5
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target "$TARGET"
      # Keep repository refresh and package installation visible separately.
      # A stalled runner/mirror must fail within the original job budget and
      # must not consume it silently before any native contract can execute.
      - name: Refresh Linux package metadata
        if: runner.os == 'Linux'
        timeout-minutes: 4
        run: |
          sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
            -o DPkg::Lock::Timeout=30 update --error-on=any
      - name: Install Linux musl tools
        if: runner.os == 'Linux'
        timeout-minutes: 4
        run: |
          sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
            -o DPkg::Lock::Timeout=30 install -y musl-tools
      - name: Build and execute release artifact
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sh scripts/build-native-artifact.sh "$TARGET" "$RUNNER_TEMP/artifacts"
          cargo +1.85.1 build --release --locked --manifest-path native/devtools/Cargo.toml
          sh scripts/install-native-test-tools.sh "$RUNNER_TEMP/test-bin"
      - name: Compiler-free differential
        env:
          TARGET: ${{ matrix.target }}
        run: |
          export PATH="$RUNNER_TEMP/test-bin:/usr/bin:/bin:/usr/sbin:/sbin"
          if command -v cargo || command -v rustc; then
            echo 'Rust compiler unexpectedly visible on runtime test PATH' >&2
            exit 1
          fi
          date -u
          native/devtools/target/release/agent-guard-devtools native-redaction --core "$RUNNER_TEMP/artifacts/agent-guard-redact-$TARGET" > "$RUNNER_TEMP/artifacts/differential.json"
          date -u
      - name: Preserve Intel differential checkpoint
        if: always() && matrix.target == 'x86_64-apple-darwin'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checkpoint-intel-differential
          path: ${{ runner.temp }}/artifacts/differential.json
          if-no-files-found: warn
      - name: Compiler-free integration
        env:
          TARGET: ${{ matrix.target }}
        run: |
          export PATH="$RUNNER_TEMP/test-bin:/usr/bin:/bin:/usr/sbin:/sbin"
          if command -v cargo || command -v rustc; then
            echo 'Rust compiler unexpectedly visible on runtime test PATH' >&2
            exit 1
          fi
          date -u
          native/devtools/target/release/agent-guard-devtools native-integration --core "$RUNNER_TEMP/artifacts/agent-guard-redact-$TARGET" --scanner "$RUNNER_TEMP/test-bin/gitleaks" > "$RUNNER_TEMP/artifacts/integration.json"
          date -u
      - name: Preserve Intel integration checkpoint
        if: always() && matrix.target == 'x86_64-apple-darwin'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checkpoint-intel-integration
          path: ${{ runner.temp }}/artifacts/integration.json
          if-no-files-found: warn
      - name: Compiler-free integration-2
        if: matrix.target == 'x86_64-apple-darwin'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          export PATH="$RUNNER_TEMP/test-bin:/usr/bin:/bin:/usr/sbin:/sbin"
          if command -v cargo || command -v rustc; then
            echo 'Rust compiler unexpectedly visible on runtime test PATH' >&2
            exit 1
          fi
          date -u
          native/devtools/target/release/agent-guard-devtools native-integration --core "$RUNNER_TEMP/artifacts/agent-guard-redact-$TARGET" --scanner "$RUNNER_TEMP/test-bin/gitleaks" > "$RUNNER_TEMP/artifacts/integration-2.json"
          date -u
      - name: Preserve Intel integration-2 checkpoint
        if: always() && matrix.target == 'x86_64-apple-darwin'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checkpoint-intel-integration-2
          path: ${{ runner.temp }}/artifacts/integration-2.json
          if-no-files-found: warn
      - name: Compiler-free integration-3
        if: matrix.target == 'x86_64-apple-darwin'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          export PATH="$RUNNER_TEMP/test-bin:/usr/bin:/bin:/usr/sbin:/sbin"
          if command -v cargo || command -v rustc; then
            echo 'Rust compiler unexpectedly visible on runtime test PATH' >&2
            exit 1
          fi
          date -u
          native/devtools/target/release/agent-guard-devtools native-integration --core "$RUNNER_TEMP/artifacts/agent-guard-redact-$TARGET" --scanner "$RUNNER_TEMP/test-bin/gitleaks" > "$RUNNER_TEMP/artifacts/integration-3.json"
          date -u
      - name: Preserve Intel integration-3 checkpoint
        if: always() && matrix.target == 'x86_64-apple-darwin'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checkpoint-intel-integration-3
          path: ${{ runner.temp }}/artifacts/integration-3.json
          if-no-files-found: warn
      - name: Compiler-free audit contracts
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          export PATH="$RUNNER_TEMP/test-bin:/usr/bin:/bin:/usr/sbin:/sbin"
          if command -v cargo || command -v rustc; then
            echo 'Rust compiler unexpectedly visible on runtime test PATH' >&2
            exit 1
          fi
          date -u
          AGENT_GUARD_RUST_CORE_BIN="$RUNNER_TEMP/artifacts/agent-guard-redact-$TARGET" sh tests/native-suite.sh audit 2>&1 | tee "$RUNNER_TEMP/artifacts/audit.log"
          date -u
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-${{ matrix.target }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error
  installation:
    name: Native installation (${{ matrix.os }})
    needs: platform
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: native-*
          path: ${{ runner.temp }}/downloaded
      - name: Prepare qualified artifacts and runtime dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/native" "$RUNNER_TEMP/install-evidence"
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin; do
            dir="$RUNNER_TEMP/downloaded/native-$target"
            cp "$dir"/agent-guard-redact-* "$RUNNER_TEMP/native/"
          done
          chmod 755 "$RUNNER_TEMP/native"/agent-guard-redact-*
          sh scripts/install-native-test-tools.sh "$RUNNER_TEMP/test-bin"
      - name: Compiler-free fresh install, published update and failure recovery
        run: |
          export PATH="$RUNNER_TEMP/test-bin:/usr/bin:/bin:/usr/sbin:/sbin"
          if command -v cargo || command -v rustc; then
            echo 'Rust compiler unexpectedly visible on runtime test PATH' >&2
            exit 1
          fi
          export AGENT_GUARD_NATIVE_ARTIFACT_DIR="$RUNNER_TEMP/native"
          sh tests/packaged-performance-gate.sh > "$RUNNER_TEMP/install-evidence/performance-gate.log" 2>&1
          sh tests/native-release.sh > "$RUNNER_TEMP/install-evidence/release-selection.log" 2>&1
          sh tests/tempdir-failure.sh > "$RUNNER_TEMP/install-evidence/tempdir-failure.log" 2>&1
          sh tests/native-install.sh > "$RUNNER_TEMP/install-evidence/install.log" 2>&1
          sh tests/native-install.sh 3.7.1 > "$RUNNER_TEMP/install-evidence/install-from-3.7.1.log" 2>&1
          sh tests/bootstrap-update.sh > "$RUNNER_TEMP/install-evidence/bootstrap.log" 2>&1
          case "$(uname -s):$(uname -m)" in
            Linux:x86_64) target=x86_64-unknown-linux-musl ;;
            Linux:aarch64) target=aarch64-unknown-linux-musl ;;
            Darwin:x86_64) target=x86_64-apple-darwin ;;
            Darwin:arm64) target=aarch64-apple-darwin ;;
            *) exit 2 ;;
          esac
          sh tests/native-packaged.sh "$RUNNER_TEMP/native/agent-guard-redact-$target" "$RUNNER_TEMP/test-bin/gitleaks" > "$RUNNER_TEMP/install-evidence/fallback.log" 2>&1
          sh tests/fused-packaged.sh "$RUNNER_TEMP/native/agent-guard-redact-$target" "$RUNNER_TEMP/test-bin/gitleaks" > "$RUNNER_TEMP/install-evidence/fused-packaged.log" 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-install-${{ matrix.os }}
          path: ${{ runner.temp }}/install-evidence/
          if-no-files-found: error
  complete:
    name: Native platform artifacts
    if: always()
    # Wait for the evidence jobs without judging them, so this check turns
    # green only after the workflow run is completed for release lookup.
    needs: [platform, installation, performance, fused-performance]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      # continue-on-error keeps a failed performance job out of the run
      # conclusion, so the run list shows green. Name those jobs where the run
      # summary and annotations show them, without changing the conclusion.
      - name: Report performance evidence that did not pass
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # A partial re-run keeps the earlier result of jobs it did not
          # re-run, so judge each job by its latest attempt across the run.
          jobs="$RUNNER_TEMP/run-jobs.json"
          if ! gh api --paginate --slurp "repos/$REPO/actions/runs/$RUN_ID/jobs?filter=all&per_page=100" > "$jobs" \
            || ! failed=$(jq -r '
              [.[].jobs[]] | group_by(.name) | map(max_by(.run_attempt))[]
              | select((.name | startswith("Packaged performance evidence") or startswith("Fused packaged performance"))
                       and .conclusion != "success" and .conclusion != "skipped")
              | "\(.name): \(.conclusion // "unfinished") (attempt \(.run_attempt))"' "$jobs"); then
            echo '::warning title=Performance evidence status unknown::could not read the job conclusions of this run'
            exit 0
          fi
          [ -n "$failed" ] || exit 0
          {
            echo '### Performance evidence that did not pass'
            echo
            printf '%s\n' "$failed" | sed 's/^/- /'
            echo
            echo 'These jobs are evidence, not gates: the run conclusion and release lookup ignore them.'
            echo 'Their artifacts keep the 9-pair screening and the 21-pair confirmation rows.'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$failed" | while IFS= read -r line; do
            echo "::warning title=Performance evidence did not pass::$line"
          done
      - name: Require all four native executions
        env:
          RESULT: ${{ needs.platform.result }}
          INSTALL: ${{ needs.installation.result }}
        run: test "$RESULT" = success && test "$INSTALL" = success

  # Performance jobs are evidence, not gates: shared-runner noise around the
  # 5% threshold failed releases without a real regression. The workflow
  # conclusion (read by scripts/prepare-native-release.sh) ignores them, and
  # `complete` names the ones that failed. A screened 5% regression must also
  # repeat in a 21-pair confirmation (bench/native/confirm.jq).
  performance:
    name: Packaged performance evidence
    needs: platform
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/native-performance
      - name: Measure the packaged binary under enforced cgroup limits
        run: |
          mkdir -p plugins/agent-guard/libexec
          cp "$RUNNER_TEMP/native-performance/agent-guard-redact-x86_64-unknown-linux-musl"* plugins/agent-guard/libexec/
          chmod 755 plugins/agent-guard/libexec/agent-guard-redact-x86_64-unknown-linux-musl
          sh scripts/install-native-test-tools.sh "$RUNNER_TEMP/test-bin"
          sh bench/native/run-packaged.sh "$RUNNER_TEMP/test-bin/gitleaks" 9a0ee9eb2eed1e60b78d4404f985b077149c675d "$RUNNER_TEMP/performance"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: packaged-performance
          path: ${{ runner.temp }}/performance/
          if-no-files-found: error

  fused-performance:
    name: Fused packaged performance (${{ matrix.scanner }}, ${{ matrix.audit }})
    needs: platform
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scanner: [official, homebrew]
        audit: [off, cold, warm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/qualified-core
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.0'
          cache: false
      - name: Prepare unchanged scanner for both arms
        env:
          SCANNER_KIND: ${{ matrix.scanner }}
        run: |
          sh scripts/install-native-test-tools.sh "$RUNNER_TEMP/test-bin"
          mkdir "$RUNNER_TEMP/scanner"
          if [ "$SCANNER_KIND" = official ]; then
            cp "$RUNNER_TEMP/test-bin/gitleaks" "$RUNNER_TEMP/scanner/gitleaks"
          else
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            HOMEBREW_NO_AUTO_UPDATE=1 brew install gitleaks
            installed="$(brew --prefix gitleaks)/bin/gitleaks"
            test "$("$installed" version)" = 8.30.1
            bottle=$(brew --cache gitleaks)
            printf '%s  %s\n' 78b43afdf14a05c5df07b73aeaf63ae56b784c905f057411a43ee8fde40fe5d1 "$bottle" \
              | sha256sum -c - > "$RUNNER_TEMP/scanner/bottle-checksum.txt"
            cp "$installed" "$RUNNER_TEMP/scanner/gitleaks"
            cmp "$installed" "$RUNNER_TEMP/scanner/gitleaks"
            brew info --json=v2 gitleaks > "$RUNNER_TEMP/scanner/homebrew.json"
            brew config > "$RUNNER_TEMP/scanner/homebrew-config.txt"
            cp "$(brew --prefix gitleaks)/sbom.spdx.json" "$RUNNER_TEMP/scanner/homebrew-sbom.json"
            file "$installed" > "$RUNNER_TEMP/scanner/executable-format.txt"
          fi
          # The pinned public Homebrew ELF also fails Go's build-info reader
          # before installation. Preserve that diagnostic, but use the verified
          # bottle, SBOM, installed bytes and actual execution as its identity.
          if go version -m "$RUNNER_TEMP/scanner/gitleaks" > "$RUNNER_TEMP/scanner/buildinfo.txt" 2> "$RUNNER_TEMP/scanner/buildinfo.stderr"; then
            printf '0\n' > "$RUNNER_TEMP/scanner/buildinfo.status"
          else
            status=$?
            printf '%s\n' "$status" > "$RUNNER_TEMP/scanner/buildinfo.status"
            test "$SCANNER_KIND" = homebrew
          fi
          sha256sum "$RUNNER_TEMP/scanner/gitleaks" > "$RUNNER_TEMP/scanner/binary.sha256"
      - name: Compare the actual shared packaged core against public v3.7.0
        env:
          AUDIT_STATE: ${{ matrix.audit }}
          SCANNER_KIND: ${{ matrix.scanner }}
        run: |
          export AGENT_GUARD_BENCH_FUSED_PACKAGED_CORE="$RUNNER_TEMP/qualified-core/agent-guard-redact-x86_64-unknown-linux-musl"
          chmod 755 "$AGENT_GUARD_BENCH_FUSED_PACKAGED_CORE"
          sh bench/fused-output/run-constrained.sh "$RUNNER_TEMP/scanner/gitleaks" "$AUDIT_STATE" "$RUNNER_TEMP/evidence"
          jq -e '.measurements_complete and (.ordinary_regressions | length) == 0 and all(.all_cases[]; .verified)' "$RUNNER_TEMP/evidence/assessment.json"
          if [ "$SCANNER_KIND" = homebrew ]; then
            jq -e '.performance_accepted' "$RUNNER_TEMP/evidence/assessment.json"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fused-packaged-${{ matrix.scanner }}-${{ matrix.audit }}
          path: |
            ${{ runner.temp }}/evidence/
            ${{ runner.temp }}/scanner/*.*
            ${{ runner.temp }}/qualified-core/*.build.txt
          if-no-files-found: error
