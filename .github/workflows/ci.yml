name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  # An ordinary merge runs Linux only, so the macOS legs run nightly on main
  # (skipped when main has not changed since the last green nightly run), on
  # release PRs and on manual runs.
  schedule:
    - cron: '41 18 * * *'

# Replace only obsolete runs: of the same PR, or of an older main push. Manual
# runs keep unique groups, so the release gate's dispatch at a release SHA is
# never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

env:
  # Single source of truth for the pinned gitleaks scanner, shared by the
  # secret-guard action invocation and the Test job's real-gitleaks install.
  # Keep in lock-step with release.yml and the defaults in action.yml,
  # bin/agent-guard, and plugins/agent-guard/scripts/gitleaks-checksum.sh
  # (tests/run.sh enforces that version sync).
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz. Linux/x64 runners only; a
  # different OS/arch archive has a different digest.
  GITLEAKS_CHECKSUM_LINUX_X64: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  release-evidence:
    # Only a main push or a nightly run can reuse evidence; pull requests and
    # manual runs skip this job, so the required scan never waits for it.
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # Agent Guard waits for this job; a stalled lookup must not hold it.
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      checks: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.release.outputs.reuse == 'true' || steps.tested.outputs.reuse == 'true' }}
      ordinary: ${{ steps.tested.outputs.ordinary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Only a main push compares release history. Strings: a numeric 0
          # is false in an expression.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
          persist-credentials: false
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/scripts/reuse-release-tree.sh >> "$GITHUB_OUTPUT"
      # A main push of a tree its PR run already passed, or a nightly run of
      # an unchanged main, reuses that run.
      - id: tested
        if: steps.release.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/scripts/reuse-tested-tree.sh ci.yml >> "$GITHUB_OUTPUT"
  secret-guard:
    name: Agent Guard
    # Agent Guard is required: it reports even when evidence lookup fails,
    # and an empty answer selects full coverage.
    needs: release-evidence
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      oses: ${{ steps.scope.outputs.oses }}
      check_prefix: ${{ steps.scope.outputs.check_prefix }}
      include: ${{ steps.scope.outputs.include }}
      tests: ${{ steps.scope.outputs.tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out its merge commit; its first parent is
          # the base, so the two commits give the pull request's changes.
          fetch-depth: 2

      - name: Select CI coverage and check identity
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          ORDINARY: ${{ needs.release-evidence.outputs.ordinary }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          else
            : > "$RUNNER_TEMP/changed"
          fi
          sh .github/scripts/ci-scope.sh "$EVENT_NAME" "$HEAD_REF" "$ORDINARY" < "$RUNNER_TEMP/changed" >> "$GITHUB_OUTPUT"

      - name: Scan for secrets
        uses: ./
        with:
          paths: "."
          gitleaks-version: ${{ env.GITLEAKS_VERSION }}
          gitleaks-checksum: ${{ env.GITLEAKS_CHECKSUM_LINUX_X64 }}

      # The tree this run tests (a PR run checks out its merge commit); the main
      # push of the same tree, or the next nightly, reuses this run only
      # through this record. A nightly that reused evidence records nothing. Without
      # it the main push runs again, so a failed upload never fails the job.
      - name: Record the tested tree
        if: (github.event_name == 'pull_request' && steps.scope.outputs.tests == 'true') || (github.event_name == 'schedule' && needs.release-evidence.outputs.reuse != 'true')
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/tested-tree"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/tested-tree/tree"
      - name: Upload the tested tree
        if: (github.event_name == 'pull_request' && steps.scope.outputs.tests == 'true') || (github.event_name == 'schedule' && needs.release-evidence.outputs.reuse != 'true')
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-tree
          path: ${{ runner.temp }}/tested-tree/tree
          retention-days: 30
          # A re-run keeps the run id and must replace the earlier record.
          overwrite: true

  test-shard:
    name: ${{ matrix.suite }} (${{ matrix.os }})
    needs: [secret-guard, release-evidence]
    # A failed evidence job reuses nothing: the shards still run.
    if: ${{ !cancelled() && needs.secret-guard.result == 'success' && needs.release-evidence.outputs.reuse != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.secret-guard.outputs.oses) }}
        bundle: [core, commands, navigation-claude, navigation-codex, scanner]
        timeout_minutes: [25]
        # Suites and, on full runs only, the macOS legs: see ci-scope.sh.
        include: ${{ fromJSON(needs.secret-guard.outputs.include) }}
    runs-on: ${{ matrix.os }}
    # Keep a bounded runner lifetime. Partitions are balanced by measured
    # test time, not assertion count; see CONTRIBUTING.md#test-partitions for the mapping.
    # The earlier ~14-minute partition 5 measurement was a child sharing one
    # runner with partition 2, not an independent runner duration.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      - name: Record test job start
        run: echo "TEST_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs freshly-downloaded third-party binaries and never
          # pushes, so do not leave the GITHUB_TOKEN in the git config.
          persist-credentials: false

      - name: Install pinned gitleaks (Linux x64)
        # Only shard 4 and the rule suites of the Codex navigation job consume
        # real gitleaks. Other shards use the bundled mock; installing the
        # same archive there adds unused downloads. The navigation partition
        # itself keeps the mock, which tests/run.sh puts first on PATH.
        # Real gitleaks is REQUIRED on Linux shard 4 so tests/run.sh exercises its
        # real-detection block (the #124 anchored-placeholder scan-accuracy
        # regressions) and so `make smoke-test` can run end-to-end. On macOS the
        # suite self-skips the real-gitleaks block and uses the bundled mock,
        # which gives full cross-OS coverage on main and release PRs. The
        # macOS/darwin archive has a different checksum than the pin above, so
        # the real-gitleaks + smoke steps are scoped to Linux only.
        if: runner.os == 'Linux' && (matrix.bundle == 'scanner' || matrix.bundle == 'navigation-codex') && needs.secret-guard.outputs.tests == 'true'
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" -o "${tmp}/${archive}"
          echo "${GITLEAKS_CHECKSUM_LINUX_X64}  ${tmp}/${archive}" | sha256sum -c -
          tar -xzf "${tmp}/${archive}" -C "${tmp}"
          mkdir -p "${RUNNER_TEMP}/agent-guard-bin"
          mv "${tmp}/gitleaks" "${RUNNER_TEMP}/agent-guard-bin/gitleaks"
          chmod +x "${RUNNER_TEMP}/agent-guard-bin/gitleaks"
          echo "${RUNNER_TEMP}/agent-guard-bin" >> "${GITHUB_PATH}"

      - name: Run tests
        # A documentation-only pull request skips the suites; the job still
        # reports under its name, and main and release PRs run everything.
        if: needs.secret-guard.outputs.tests == 'true'
        env:
          TEST_PARTITIONS: ${{ matrix.shards }}
          AGENT_GUARD_TEST_NAVIGATION_HOST: ${{ matrix.navigation_host }}
        run: |
          jq --version
          # IDs come only from the checked-in matrix; the driver validates
          # one or two distinct IDs and preserves every child exit status.
          read -r -a partitions <<< "$TEST_PARTITIONS"
          bash .github/scripts/run-test-bundle.sh "${partitions[@]}"

      - name: Real gitleaks rule suites (Linux)
        # The suites that check the rules and allowlists of gitleaks.toml
        # against the real scanner. They are a step of this job, not of the
        # scanner job, because the scanner job is the longest of a pull request
        # and this one the shortest, and not a job of their own because branch
        # protection requires this job by name. The script fails on Linux CI
        # when gitleaks is missing, and when a suite skips.
        if: runner.os == 'Linux' && matrix.bundle == 'navigation-codex' && needs.secret-guard.outputs.tests == 'true'
        run: sh tests/real-gitleaks-rules.sh

      - name: Require real gitleaks integration ran (Linux)
        # Fail closed if the real-detection block silently self-skipped: on a
        # runner with no gitleaks, tests/run.sh drops the #124 regressions
        # without failing, which is exactly the green-but-untested state #134 is
        # about. On Linux gitleaks is installed above, so a skip here is a bug.
        # The block lives in shard 4; moving it without updating this condition
        # fails the grep below instead of passing silently.
        if: runner.os == 'Linux' && matrix.bundle == 'scanner' && needs.secret-guard.outputs.tests == 'true'
        run: |
          set -eu
          if grep -q 'real gitleaks not available; skipped real-gitleaks integration tests' "${RUNNER_TEMP}/test-output.txt"; then
            echo "::error::real-gitleaks integration tests were skipped; gitleaks was not on PATH in CI" >&2
            exit 1
          fi
          grep -q 'ok - real gitleaks detects an RSA private key through scan-path' "${RUNNER_TEMP}/test-output.txt" \
            || { echo "::error::expected real-gitleaks detection assertions are missing from the test output" >&2; exit 1; }

      - name: Smoke test (real git/jq/gitleaks E2E)
        if: runner.os == 'Linux' && matrix.bundle == 'scanner' && needs.secret-guard.outputs.tests == 'true'
        run: make smoke-test

      - name: Summarize suite timings and job time budget
        if: always() && needs.secret-guard.outputs.tests == 'true'
        env:
          TEST_JOB_TIMEOUT_MINUTES: ${{ matrix.timeout_minutes }}
        run: sh .github/scripts/test-timing-summary.sh

  test:
    # Only full coverage may produce the names release.yml consumes.
    # Any shard or awk timing failure fails both aggregate checks.
    name: ${{ needs.secret-guard.outputs.check_prefix }} (${{ matrix.os }})
    needs: [secret-guard, test-shard, release-evidence, long-input]
    if: always()
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test shard to pass
        env:
          SHARDS_RESULT: ${{ needs.test-shard.result }}
          LONG_INPUT_RESULT: ${{ needs.long-input.result }}
          REUSED: ${{ needs.release-evidence.outputs.reuse }}
          EVIDENCE_RESULT: ${{ needs.release-evidence.result }}
        run: |
          if [ "$LONG_INPUT_RESULT" != success ]; then
            echo "::error::large hook inputs finished with: $LONG_INPUT_RESULT" >&2
            exit 1
          fi
          if [ "$REUSED" = true ] && [ "$EVIDENCE_RESULT" = success ]; then
            echo 'Required checks passed on the identical tested tree'
            exit 0
          fi
          if [ "$SHARDS_RESULT" != success ]; then
            echo "::error::test shards finished with: $SHARDS_RESULT" >&2
            exit 1
          fi

  long-input:
    name: Large hook inputs (${{ matrix.awk }})
    needs: secret-guard
    if: ${{ !cancelled() && needs.secret-guard.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        awk: [mawk, gawk, busybox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the selected awk
        if: needs.secret-guard.outputs.tests == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.awk }}
      - name: Compare large inputs with controls
        if: needs.secret-guard.outputs.tests == 'true'
        env:
          AGENT_GUARD_TEST_LONG_INPUT_AWKS: ${{ matrix.awk }}
          AGENT_GUARD_TEST_REQUIRE_AWKS: ${{ matrix.awk }}
        run: sh tests/long-input.sh

  lint:
    name: Lint
    needs: release-evidence
    if: ${{ !cancelled() && needs.release-evidence.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHELLCHECK_VERSION: "0.10.0"
      ACTIONLINT_VERSION: "1.7.7"
      # sha256 of shellcheck-v0.10.0.linux.x86_64.tar.xz. The shellcheck release
      # publishes no checksums file, so this is cross-checked against
      # pantsbuild's independently published known_versions entry
      # ("v0.10.0|linux_x86_64|6c881ab…|2404716", digest and byte length both
      # matching the release asset).
      SHELLCHECK_CHECKSUM_LINUX_X64: "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87"
      # sha256 of actionlint_1.7.7_linux_amd64.tar.gz, taken from the upstream
      # actionlint_1.7.7_checksums.txt release asset.
      ACTIONLINT_CHECKSUM_LINUX_X64: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Runs freshly-downloaded shellcheck/actionlint and never pushes.
          persist-credentials: false

      - name: Install pinned shellcheck
        run: |
          set -euo pipefail
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" -o "${tmp}/${archive}"
          echo "${SHELLCHECK_CHECKSUM_LINUX_X64}  ${tmp}/${archive}" | sha256sum -c -
          tar -xJf "${tmp}/${archive}" -C "${tmp}"
          mkdir -p "${RUNNER_TEMP}/lint-bin"
          mv "${tmp}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "${RUNNER_TEMP}/lint-bin/shellcheck"
          chmod +x "${RUNNER_TEMP}/lint-bin/shellcheck"
          echo "${RUNNER_TEMP}/lint-bin" >> "${GITHUB_PATH}"

      - name: Install pinned actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" -o "${tmp}/${archive}"
          echo "${ACTIONLINT_CHECKSUM_LINUX_X64}  ${tmp}/${archive}" | sha256sum -c -
          tar -xzf "${tmp}/${archive}" -C "${tmp}" actionlint
          mkdir -p "${RUNNER_TEMP}/lint-bin"
          mv "${tmp}/actionlint" "${RUNNER_TEMP}/lint-bin/actionlint"
          chmod +x "${RUNNER_TEMP}/lint-bin/actionlint"
          echo "${RUNNER_TEMP}/lint-bin" >> "${GITHUB_PATH}"

      - name: ShellCheck shell scripts
        # --severity=error only: these scripts predate the linter and lean on
        # deliberate idioms shellcheck flags at warning/info/style (e.g.
        # `CDPATH= cd` prefixes, single-quoted `$…` literals passed to `sh -c`).
        # Gating on real errors catches genuine bugs without turning that
        # pre-existing style backlog into a merge blocker; tightening the
        # severity is separate cleanup.
        run: |
          set -euo pipefail
          # A hand-kept list silently loses coverage each time a script is
          # added, and five had already fallen out of it.
          #
          # One process per file: a single invocation over every script peaked
          # at 13.6 GiB resident memory (OOM on the runner). xargs exits 123
          # when any invocation fails, and pipefail propagates that.
          #
          # --extended-analysis=false: the dataflow analysis is what grows with
          # file size. On tests/run.sh alone it passed 13 GiB (measured,
          # ShellCheck 0.11.0), and the runner was shut down mid-step with no
          # diagnostics once that file grew a little more. Without it the same
          # file takes 0.3 GiB and 7 s. This step gates on error-severity
          # findings only, and on the other 114 scripts the two modes print
          # the same result (measured).
          { git ls-files -z '*.sh'; printf '%s\0' plugins/agent-guard/bin/agent-guard githooks/pre-commit; } \
            | xargs -0 -n 1 shellcheck --severity=error --extended-analysis=false

      - name: actionlint workflows
        # actionlint auto-discovers every workflow under .github/workflows and
        # runs shellcheck over each run: block. Its -shellcheck flag takes an
        # executable PATH, not args, so pass the severity via SHELLCHECK_OPTS —
        # matching the standalone ShellCheck step so the pre-existing style
        # backlog in run blocks does not fail the job.
        env:
          SHELLCHECK_OPTS: --severity=error
        run: actionlint -color
