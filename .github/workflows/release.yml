name: release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "major | minor | patch (ignored when version is set)"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      version:
        description: "Explicit X.Y.Z version; also resumes a merged release at the same version"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Exercise preparation, dispatched CI and asset qualification without publishing"
        required: false
        default: false
        type: boolean
      replace_stale_branch:
        description: "Replace a different candidate only when its release branch has no open PR"
        required: false
        default: false
        type: boolean
  pull_request:
    types: [closed]
    branches: [main]
permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_CHECKSUM_LINUX_X64: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.ver.outputs.version }}
      major: ${{ steps.ver.outputs.major }}
      branch: ${{ steps.ver.outputs.branch }}
      previous: ${{ steps.ver.outputs.previous }}
      pr: ${{ steps.plan.outputs.pr }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && 'main' || github.ref }}
          persist-credentials: false
      - name: Require current main for publication
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$DRY_RUN" = true ]; then
            echo 'Branch dispatch is allowed only for a dry run'
          else
            [ "$EVENT_NAME" = pull_request ] || [ "$DISPATCH_REF" = refs/heads/main ]
            [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
              echo 'Checkout is not current main; restart from current main' >&2
              exit 1
            }
          fi
      - name: Compute next version
        id: ver
        env:
          # Pass the free-form input through the environment, never interpolated
          # into the script body — `${{ inputs.version }}` inlined into `run:`
          # executes as shell before the X.Y.Z check below can reject it.
          INPUT_VERSION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          explicit="$INPUT_VERSION"
          if [ "$EVENT_NAME" = pull_request ]; then explicit=${explicit##*/v}; fi
          cur=$(git tag --sort=-version:refname --list 'v*' \
            | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            | head -n1 | sed 's/^v//' || true)
          : "${cur:=0.0.0}"
          if [ -n "$explicit" ]; then
            if ! printf '%s' "$explicit" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
              echo "version input must be canonical X.Y.Z without leading zeros (got: $explicit)"
              exit 1
            fi
            v="$explicit"
            MA="${v%%.*}"
            echo "using explicit version v${v} - bump input ignored"
          else
            IFS=. read -r MA MI PA <<<"$cur"
            : "${MA:=0}"; : "${MI:=0}"; : "${PA:=0}"
            case "${{ inputs.bump }}" in
              major) MA=$((MA+1)); MI=0; PA=0 ;;
              minor) MI=$((MI+1)); PA=0 ;;
              patch) PA=$((PA+1)) ;;
            esac
            v="${MA}.${MI}.${PA}"
          fi
          echo "version=$v"           >> "$GITHUB_OUTPUT"
          echo "major=v${MA}"         >> "$GITHUB_OUTPUT"
          echo "branch=release/v${v}" >> "$GITHUB_OUTPUT"
          echo "previous=${cur}"      >> "$GITHUB_OUTPUT"

      - name: Select preparation or reviewed publication
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          echo "dry_run=${DRY_RUN:-false}" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = pull_request ]; then
            body=$(gh pr view "$EVENT_PR" --json body --jq .body)
            if ! printf '%s' "$body" | grep -Fq '<!-- agent-guard-release:publish -->'; then
              echo 'Closed PR is not a publishable release candidate'
              echo 'mode=none' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "pr=$EVENT_PR" >> "$GITHUB_OUTPUT"
            echo 'mode=publish' >> "$GITHUB_OUTPUT"
          elif [ "$(jq -r .version plugins/agent-guard/.claude-plugin/plugin.json)" = "$RELEASE_VERSION" ]; then
            [ -n "$INPUT_VERSION" ] || { echo 'Same-version retry requires explicit version' >&2; exit 1; }
            number=$(gh pr list --state merged --base main --head "release/v$RELEASE_VERSION" --json number,mergedAt --jq 'sort_by(.mergedAt) | last | .number // empty')
            [ -n "$number" ] || { echo 'No merged release PR for same-version retry' >&2; exit 1; }
            echo "pr=$number" >> "$GITHUB_OUTPUT"
            echo 'mode=publish' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=prepare' >> "$GITHUB_OUTPUT"
          fi
  prepare:
    needs: plan
    if: needs.plan.outputs.mode == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr: ${{ steps.pr.outputs.number }}
      branch: ${{ steps.pr.outputs.branch }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Check candidate version and immutable publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          PREVIOUS_VERSION: ${{ needs.plan.outputs.previous }}
        run: |
          set -euo pipefail
          IFS=. read -r ma mi pa <<< "$RELEASE_VERSION"
          IFS=. read -r old_ma old_mi old_pa <<< "$PREVIOUS_VERSION"
          if ! { [ "$ma" -gt "$old_ma" ] ||
            { [ "$ma" -eq "$old_ma" ] && [ "$mi" -gt "$old_mi" ]; } ||
            { [ "$ma" -eq "$old_ma" ] && [ "$mi" -eq "$old_mi" ] && [ "$pa" -gt "$old_pa" ]; }; }; then
            echo 'Candidate must be greater than latest strict semver tag' >&2
            exit 1
          fi
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published assets' >&2
            exit 1
          fi
      - name: Bump version in tracked files
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          v="$RELEASE_VERSION"
          for f in plugins/agent-guard/.claude-plugin/plugin.json plugins/agent-guard/.codex-plugin/plugin.json; do
            jq --arg v "$v" '.version=$v' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
          # Marketplace catalog: bump the agent-guard plugin entry's version field.
          mp=.claude-plugin/marketplace.json
          if [ -f "$mp" ]; then
            jq --arg v "$v" '(.plugins[] | select(.name=="agent-guard") | .version) = $v' \
              "$mp" > "$mp.tmp" && mv "$mp.tmp" "$mp"
          fi
          # Keep the copy-pasteable managed Claude settings pinned to the same
          # release as the plugin manifests and marketplace catalog.
          managed=deployment/claude-managed-settings.example.json
          if [ -f "$managed" ]; then
            jq --arg ref "v${v}" '
              .extraKnownMarketplaces["agent-guard"].source.ref = $ref
              | (.strictKnownMarketplaces[] | select(.source == "github" and .repo == "JeongJaeSoon/agent-guard") | .ref) = $ref
            ' "$managed" > "$managed.tmp" && mv "$managed.tmp" "$managed"
          fi
          # Replace any pinned semver in README install snippets (no-op if none).
          sed -i -E "s|agent-guard@[0-9]+\.[0-9]+\.[0-9]+|agent-guard@${v}|g" README.md
          # Bump the VERSION constant the CLI reports via 'agent-guard version'.
          # Without this the binary ships a stale literal even after a tag bump
          # (v1.1.1 shipped with VERSION=1.0.0 because this step was missing).
          sed -i -E "s|^VERSION=[0-9]+\.[0-9]+\.[0-9]+$|VERSION=${v}|" plugins/agent-guard/bin/agent-guard

      - name: Build CHANGELOG entry
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          v="$RELEASE_VERSION"
          last=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          {
            echo "## v${v} - $(date -u +%F)"
            echo
            git log "${last}..HEAD" --pretty='- %s' || true
            echo
            if [ -f CHANGELOG.md ]; then
              cat CHANGELOG.md
            fi
          } > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md

      - name: Install pinned gitleaks for release validation
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          tmp=$(mktemp -d)
          curl -fsSL "$url" -o "${tmp}/${archive}"
          echo "${GITLEAKS_CHECKSUM_LINUX_X64}  ${tmp}/${archive}" | sha256sum -c -
          tar -xzf "${tmp}/${archive}" -C "$tmp" gitleaks
          mkdir -p "${RUNNER_TEMP}/agent-guard-bin"
          mv "${tmp}/gitleaks" "${RUNNER_TEMP}/agent-guard-bin/gitleaks"
          chmod +x "${RUNNER_TEMP}/agent-guard-bin/gitleaks"
          echo "${RUNNER_TEMP}/agent-guard-bin" >> "$GITHUB_PATH"

      - name: Validate release candidate before opening PR
        run: |
          set -euo pipefail
          scripts/validate-plugin-layout.sh --all
          scripts/validate-submission-readiness.sh
          plugins/agent-guard/bin/agent-guard smoke-test

      - name: Open release PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_BRANCH: ${{ needs.plan.outputs.branch }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          REPLACE_STALE_BRANCH: ${{ inputs.replace_stale_branch }}
        run: |
          set -euo pipefail
          v="$RELEASE_VERSION"
          br="$RELEASE_BRANCH"
          marker=publish
          if [ "$DRY_RUN" = true ]; then
            br="release/dry-run-${GITHUB_RUN_ID}/v$v"
            marker=dry-run
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$br"
          git add -A
          git commit -m "chore(release): v$v"
          local_tree=$(git rev-parse 'HEAD^{tree}')
          remote_sha=$(git ls-remote --heads origin "refs/heads/$br" | awk '{print $1; exit}')
          open_prs=$(gh pr list --state open --base main --head "$br" --json number,url)
          [ "$(printf '%s' "$open_prs" | jq length)" -le 1 ]
          url=$(printf '%s' "$open_prs" | jq -r '.[0].url // empty')
          if [ -n "$remote_sha" ]; then
            git fetch origin "$br"
            remote_tree=$(git rev-parse 'FETCH_HEAD^{tree}')
            if [ "$remote_tree" != "$local_tree" ]; then
              if [ -n "$url" ] || [ "$REPLACE_STALE_BRANCH" != true ]; then
                echo 'Different remote candidate; replacement needs replace_stale_branch and no open PR' >&2
                exit 1
              fi
              git push --force-with-lease="refs/heads/$br:$remote_sha" origin "HEAD:refs/heads/$br"
            else
              git checkout --detach "$remote_sha"
            fi
          else
            git push -u origin "$br"
          fi
          body="$RUNNER_TEMP/release-pr.md"
          {
            printf '<!-- agent-guard-release:%s -->\n\n' "$marker"
            printf 'v%s 릴리스 준비 PR입니다.\n\n' "$v"
            printf 'CI는 workflow가 직접 실행하고 필수 검사와 성능 측정 완료를 기다립니다.\n'
            printf '이 PR은 자동 병합되지 않으며, 사람의 병합이 유일한 게시 승인입니다.\n'
            printf '동일한 tree의 필수 검사 결과를 재사용하고, tree가 다르면 main 검사를 요구합니다.\n'
            printf '성능 기준 초과는 경고이며 측정 미완료·출력 검증 실패는 게시를 막습니다.\n'
            printf '\nDry run: %s. dry_run 후보는 병합해도 게시하지 않습니다.\n' "$DRY_RUN"
            printf '\n실행: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$body"
          if [ -n "$url" ]; then
            gh pr edit "$url" --title "release: v$v" --body-file "$body" --add-label release
          else
            url=$(gh pr create --title "release: v$v" --body-file "$body" --label release --base main --head "$br")
          fi
          number=$(gh pr view "$url" --json number --jq .number)
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "branch=$br" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'Candidate: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
  verify:
    needs: [plan, prepare]
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.plan.outputs.mode == 'publish' || needs.prepare.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && 'main' || github.ref }}
          persist-credentials: false
      - name: Resolve verification source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.plan.outputs.mode }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
          PR_NUMBER: ${{ needs.plan.outputs.pr }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if [ "$MODE" = prepare ]; then
            echo "source_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          else
            sh .github/scripts/release-target.sh "$PR_NUMBER" "$RELEASE_VERSION" false >> "$GITHUB_OUTPUT"
          fi
      - name: Dispatch candidate verification or changed-tree measurement
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ needs.prepare.outputs.branch || 'main' }}
          MODE: ${{ needs.plan.outputs.mode }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
        run: |
          set -euo pipefail
          if [ "$MODE" = prepare ]; then
            cut -f1 .github/release-checks.tsv | sort -u | while IFS= read -r workflow; do
              if sh .github/scripts/release-checks.sh "$SOURCE_SHA" 0 "$workflow" > /dev/null 2>&1; then
                echo "$workflow already passed at $SOURCE_SHA; not dispatching again"
              else
                gh workflow run "$workflow" --ref "$RELEASE_BRANCH"
              fi
            done
            gh workflow run performance.yml --ref "$RELEASE_BRANCH"
          elif [ "$SOURCE_SHA" = "$RELEASE_SHA" ]; then
            git fetch origin main
            [ "$(git rev-parse origin/main)" = "$SOURCE_SHA" ] || exit 1
            # The merge push starts the rest; a required workflow without a
            # push trigger would otherwise never report on this SHA.
            cut -f1 .github/release-checks.tsv | sort -u | while IFS= read -r workflow; do
              if ! awk '/^on:$/ { on = 1; next } on && /^[a-z]/ { exit } on' ".github/workflows/$workflow" | grep -Eq '^  push:'; then
                gh workflow run "$workflow" --ref main
              fi
            done
            gh workflow run performance.yml --ref main
          fi
      - name: Wait for candidate checks and measurement
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_HEAD_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          sh .github/scripts/release-checks.sh "$RELEASE_HEAD_SHA" 7200
          sh .github/scripts/release-performance.sh "$RELEASE_HEAD_SHA" 3000
  publish:
    needs: [plan, prepare, verify]
    if: >-
      always() && needs.plan.result == 'success' && needs.verify.result == 'success' &&
      (needs.plan.outputs.mode == 'publish' ||
       (needs.prepare.result == 'success' && needs.plan.outputs.dry_run == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && 'main' || github.ref }}
      - name: Resolve reviewed release tree
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.plan.outputs.pr || needs.prepare.outputs.pr }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          CANDIDATE: ${{ needs.plan.outputs.mode == 'prepare' }}
        run: |
          sh .github/scripts/release-target.sh "$PR_NUMBER" "$RELEASE_VERSION" "$CANDIDATE" >> "$GITHUB_OUTPUT"
      - name: Require checks and completed performance evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        run: |
          sh .github/scripts/release-checks.sh "$SOURCE_SHA"
          sh .github/scripts/release-performance.sh "$SOURCE_SHA"
      - name: Qualify and publish the reviewed tree
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_MAJOR: ${{ needs.plan.outputs.major }}
          RELEASE_SHA: ${{ steps.target.outputs.release_sha }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
        run: |
          set -euo pipefail
          v="$RELEASE_VERSION"
          maj="$RELEASE_MAJOR"
          git fetch origin main --tags
          expected_release_sha="$RELEASE_SHA"
          git checkout --detach "$expected_release_sha"
          head_sha=$(git rev-parse HEAD)
          if [ -z "$expected_release_sha" ] || [ "$head_sha" != "$expected_release_sha" ]; then
            echo "validated release commit was $expected_release_sha but origin/main is now $head_sha; refusing to publish"
            exit 1
          fi

          cli_version=$(sed -n 's/^VERSION=//p' plugins/agent-guard/bin/agent-guard)
          claude_version=$(jq -r '.version // ""' plugins/agent-guard/.claude-plugin/plugin.json)
          codex_version=$(jq -r '.version // ""' plugins/agent-guard/.codex-plugin/plugin.json)
          catalog_version=$(jq -r '.plugins[] | select(.name == "agent-guard") | .version // ""' .claude-plugin/marketplace.json)
          for actual in "$cli_version" "$claude_version" "$codex_version" "$catalog_version"; do
            if [ "$actual" != "$v" ]; then
              echo "release version mismatch: expected $v, found $actual"
              exit 1
            fi
          done
          scripts/validate-plugin-layout.sh --marketplace

          # Publish the reviewed version entry, including its limitations.
          # Validate it before creating any tag or release asset.
          release_notes="$RUNNER_TEMP/release-notes.md"
          awk -v version="v${v}" '
            /^## / {
              if (found) exit
              if ($2 == version) found = 1
              next
            }
            found { print; if (NF) body = 1 }
            END { if (!found || !body) exit 1 }
          ' CHANGELOG.md > "$release_notes"

          # Qualify and assemble everything before creating any version tag.
          # These artifacts were executed on all three native platforms at this
          # checked source SHA; reuse requires an identical release tree.
          native_release_dir="$RUNNER_TEMP/qualified-native"
          sh scripts/prepare-native-release.sh "$SOURCE_SHA" "$native_release_dir" "$head_sha"
          tarball_tmp=$(mktemp -d)/agent-guard-${v}.tar.gz
          AGENT_GUARD_NATIVE_ARTIFACT_DIR="$native_release_dir" \
            scripts/build-release-tarball.sh "$v" "$tarball_tmp"
          mv "$tarball_tmp" "agent-guard-${v}.tar.gz"
          sha256sum "agent-guard-${v}.tar.gz" > "agent-guard-${v}.tar.gz.sha256"
          tarball_sha=$(awk '{print $1}' "agent-guard-${v}.tar.gz.sha256")
          scripts/render-homebrew-formula.sh "$v" "$tarball_sha" > agent-guard.rb

          if [ "$DRY_RUN" = true ]; then
            echo "Dry run qualified the reviewed tree and release assets; publication skipped"
            exit 0
          fi
          git fetch origin main
          [ "$(git rev-parse origin/main)" = "$expected_release_sha" ] || {
            echo 'Main advanced during qualification; refusing to publish' >&2
            exit 1
          }
          if gh release view "v$v" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published assets' >&2
            exit 1
          fi

          # Releasing a new major line must not move an older major's compatibility
          # tag. Capture v1 before publishing v2+ and prove it is unchanged after
          # the new moving tag is pushed.
          legacy_v1_before=""
          if [ "${maj}" != "v1" ]; then
            legacy_v1_before=$(git ls-remote origin refs/tags/v1 | awk '{print $1; exit}')
            if [ -z "$legacy_v1_before" ]; then
              echo "required legacy moving tag v1 is missing; refusing to publish ${maj}"
              exit 1
            fi
          fi

          # Idempotent tag create. Detect's advisory skip_tag can be stale by
          # this point, so compare against the freshly-pulled, reviewed HEAD.
          # If the tag points elsewhere, abort instead of silently retagging.
          if git rev-parse --verify --quiet "refs/tags/v${v}" >/dev/null; then
            tag_sha=$(git rev-parse "v${v}^{}")
            if [ "$tag_sha" = "$head_sha" ]; then
              echo "tag v${v} already at HEAD - skip create"
            else
              echo "tag v${v} exists at $tag_sha but HEAD is $head_sha - aborting"
              exit 1
            fi
          else
            git tag "v${v}"
            git push origin "v${v}"
          fi
          # Major moving tag is idempotent by design (-f always replaces).
          git tag -f "${maj}"
          git push origin "${maj}" --force
          if [ -n "$legacy_v1_before" ]; then
            legacy_v1_after=$(git ls-remote origin refs/tags/v1 | awk '{print $1; exit}')
            if [ "$legacy_v1_after" != "$legacy_v1_before" ]; then
              echo "legacy moving tag v1 changed while publishing ${maj}; aborting release"
              exit 1
            fi
            echo "verified legacy moving tag v1 remains at $legacy_v1_after"
          fi

          # Recheck for a concurrent publication; never overwrite public assets.
          if gh release view "v${v}" >/dev/null 2>&1; then
            echo "release v${v} now exists; refusing to replace published assets"
            exit 1
          fi
          gh release create "v${v}" \
            --title "Agent Guard v${v}" \
            --notes-file "$release_notes" \
            "agent-guard-${v}.tar.gz" \
            "agent-guard-${v}.tar.gz.sha256" \
            agent-guard.rb install.sh bootstrap.sh THIRD_PARTY_NOTICES.md \
            "$native_release_dir"/agent-guard-redact-* \
            "$native_release_dir"/agent-guard-gitleaks-helper-* \
            "$native_release_dir/native-validation.json"

      # The tap lives in another repository, so GITHUB_TOKEN cannot write to
      # it. The release is already public when this runs; a failure here leaves
      # only the tap behind, and the error says how to catch it up by hand.
      - name: Open Homebrew tap PR
        if: ${{ needs.plan.outputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is not set; v${RELEASE_VERSION} is published but JeongJaeSoon/homebrew-tap was not updated. Register the secret, then run scripts/publish-homebrew-tap.sh ${RELEASE_VERSION} agent-guard.rb with gh signed in to an account that can write the tap (agent-guard.rb is the release asset)"
            exit 1
          fi
          scripts/publish-homebrew-tap.sh "$RELEASE_VERSION" agent-guard.rb
