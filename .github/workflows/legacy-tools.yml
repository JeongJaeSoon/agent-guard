name: Legacy jq and awk contracts
on:
  pull_request:
    paths:
      - 'plugins/agent-guard/bin/agent-guard'
      - 'tests/unit-nul-redaction.sh'
      - 'tests/printenv-argument-contract.sh'
      - 'tests/unit-audit-retention.sh'
      - 'tests/post-tool-serialization-recovery.sh'
      - 'tests/redaction-wrapped-values.sh'
      - 'tests/fixtures/redaction-wrapped-values.json'
      - 'tests/key-name-masking.sh'
      - 'tests/fixtures/key-name-masking.json'
      - 'tests/fixtures/key-name-masking-diff.txt'
      - 'tests/assignment-leftmost.sh'
      - 'tests/fixtures/assignment-leftmost.json'
      - '.github/workflows/legacy-tools.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/agent-guard/bin/agent-guard'
      - 'tests/unit-nul-redaction.sh'
      - 'tests/printenv-argument-contract.sh'
      - 'tests/unit-audit-retention.sh'
      - 'tests/post-tool-serialization-recovery.sh'
      - 'tests/redaction-wrapped-values.sh'
      - 'tests/fixtures/redaction-wrapped-values.json'
      - 'tests/key-name-masking.sh'
      - 'tests/fixtures/key-name-masking.json'
      - 'tests/fixtures/key-name-masking-diff.txt'
      - 'tests/assignment-leftmost.sh'
      - 'tests/fixtures/assignment-leftmost.json'
      - '.github/workflows/legacy-tools.yml'
  workflow_dispatch:
# Replace only obsolete runs of the same PR or of an older main push. Manual
# runs have unique groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read
jobs:
  evidence:
    # A main push skips the jobs its PR run already passed on the same tree.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.tested.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/scripts/reuse-tested-tree.sh legacy-tools.yml >> "$GITHUB_OUTPUT"
      # The tree this run tests (a PR run checks out its merge commit); the main
      # push of the same tree reuses this run only through this record. Without
      # it the main push runs again, so a failed upload never fails the job.
      - name: Record the tested tree
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/tested-tree"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/tested-tree/tree"
      - name: Upload the tested tree
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-tree
          path: ${{ runner.temp }}/tested-tree/tree
          retention-days: 30
          # A re-run keeps the run id and must replace the earlier record.
          overwrite: true
  contracts:
    name: Legacy jq and awk contracts
    needs: evidence
    if: ${{ !cancelled() && needs.evidence.outputs.reuse != 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify legacy tool contracts
        run: |
          jq --version
          test "$(jq --version)" = jq-1.6
          /usr/bin/mawk -W version
          sh tests/unit-nul-redaction.sh
          sh tests/printenv-argument-contract.sh
          AGENT_GUARD_TEST_AWK=/usr/bin/mawk sh tests/unit-audit-retention.sh
          sh tests/post-tool-serialization-recovery.sh
          # The detector calls `awk` from PATH; pin it to mawk for this contract.
          mkdir -p "$RUNNER_TEMP/mawk-bin"
          ln -sf /usr/bin/mawk "$RUNNER_TEMP/mawk-bin/awk"
          PATH="$RUNNER_TEMP/mawk-bin:$PATH" sh tests/redaction-wrapped-values.sh
      - name: Verify jq 1.8.1 successful truncation recovery
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/jq-1.8.1"
          curl -fsSL https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-linux-amd64 -o "$RUNNER_TEMP/jq-1.8.1/jq"
          printf '%s  %s\n' 020468de7539ce70ef1bceaf7cde2e8c4f2ca6c3afb84642aabc5c97d9fc2a0d "$RUNNER_TEMP/jq-1.8.1/jq" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/jq-1.8.1/jq"
          AGENT_GUARD_TEST_JQ="$RUNNER_TEMP/jq-1.8.1/jq" sh tests/post-tool-serialization-recovery.sh
  awk-implementations:
    # Separate job: installing gawk repoints the awk alternative, which would
    # change the awk the contracts job above runs on.
    name: Same assignments on mawk, gawk and busybox awk
    needs: evidence
    if: ${{ !cancelled() && needs.evidence.outputs.reuse != 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install gawk and busybox
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gawk busybox
      - name: Compare assignment candidates across awk implementations
        run: |
          mawk -W version 2>&1 | sed -n 1p
          gawk --version | sed -n 1p
          busybox | sed -n 1p
          AGENT_GUARD_TEST_REQUIRE_AWKS='mawk gawk busybox' sh tests/assignment-leftmost.sh
      - name: Compare key-name records across awk implementations
        run: |
          # The detector calls `awk` from PATH; start from mawk, and the test
          # repeats itself under gawk and busybox awk. Only the records half
          # runs here: the hook half has its own job below, so that neither
          # has to fit beside the other in this job's limit.
          mkdir -p "$RUNNER_TEMP/mawk-bin"
          ln -sf /usr/bin/mawk "$RUNNER_TEMP/mawk-bin/awk"
          AGENT_GUARD_TEST_REQUIRE_AWK_VARIANTS=1 \
            AGENT_GUARD_TEST_KEY_NAME_PART=records \
            PATH="$RUNNER_TEMP/mawk-bin:$PATH" sh tests/key-name-masking.sh
  key-name-hooks:
    # The hook half of the key-name suite under this runner's mawk. It ran in
    # the job above until the two halves together ran into that job's five
    # minutes on a slow runner and the job was cancelled. Same limit, one
    # runner each.
    name: Key-name masking hooks on mawk
    needs: evidence
    if: ${{ !cancelled() && needs.evidence.outputs.reuse != 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run the key-name hook cases under mawk
        run: |
          mawk -W version 2>&1 | sed -n 1p
          mkdir -p "$RUNNER_TEMP/mawk-bin"
          ln -sf /usr/bin/mawk "$RUNNER_TEMP/mawk-bin/awk"
          AGENT_GUARD_TEST_KEY_NAME_PART=hooks \
            PATH="$RUNNER_TEMP/mawk-bin:$PATH" sh tests/key-name-masking.sh
