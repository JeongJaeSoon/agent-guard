name: Public version common-policy benchmark
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
    paths:
      - '.github/workflows/public-version-controlled.yml'
      - 'bench/results/public-versions-20261106/runtime/**'
permissions:
  contents: read
concurrency:
  group: public-version-controlled-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
jobs:
  runtime:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'public-version-controlled'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        scanner: [official, homebrew]
        host: [claude, codex]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fixed public baseline policy and enforced resource limits
        run: sh bench/results/public-versions-20261106/runtime/ci.sh "$RUNNER_TEMP/public-version-controlled-lab" "$RUNNER_TEMP/public-version-controlled-evidence" agent-guard-public-bench:20261106 '${{ matrix.scanner }}' '${{ matrix.host }}' controlled
      - name: Restore synthetic evidence ownership for artifact export
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/public-version-controlled-evidence" ]; then
            sudo chown -R -- "$(id -u):$(id -g)" "$RUNNER_TEMP/public-version-controlled-evidence"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: public-version-controlled-linux-${{ matrix.scanner }}-${{ matrix.host }}
          path: ${{ runner.temp }}/public-version-controlled-evidence/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
