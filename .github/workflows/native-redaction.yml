name: Probe completion regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - run: sh scripts/install-native-test-tools.sh "$RUNNER_TEMP/test-bin"
      - name: Preserve failing baseline and validate minimal correction
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/test-bin:$PATH"
          mkdir -p "$RUNNER_TEMP/evidence"
          git fetch origin bd19cb501d79fdd633cd3fcf01ace84223156a1f
          git show bd19cb501d79fdd633cd3fcf01ace84223156a1f:plugins/agent-guard/bin/agent-guard > "$RUNNER_TEMP/baseline-cli"
          if PROBE_COMPLETION_SOURCE="$RUNNER_TEMP/baseline-cli" sh tests/gitleaks-probe-completion.sh > "$RUNNER_TEMP/evidence/before.log" 2>&1; then
            echo 'baseline unexpectedly passed the deterministic race' >&2
            exit 1
          fi
          grep -q '^1 passed, 2 failed$' "$RUNNER_TEMP/evidence/before.log"
          sh tests/gitleaks-probe-completion.sh > "$RUNNER_TEMP/evidence/after.log" 2>&1
          sh tests/gitleaks-resolution.sh > "$RUNNER_TEMP/evidence/resolution.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: probe-completion-${{ matrix.os }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
