name: Experimental native redactor
run-name: Numeric fallback locale and child-process diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numeric:
    name: Numeric fallback (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preserve original and instrumented execution
        run: |
          sh scripts/install-native-test-tools.sh "$RUNNER_TEMP/test-bin"
          export PATH="$RUNNER_TEMP/test-bin:$PATH"
          mkdir "$RUNNER_TEMP/evidence"
          locale > "$RUNNER_TEMP/evidence/locale.txt"
          AG_NUMERIC_TIME_CHILDREN=1 python3 bench/fused-output/diagnose-numeric.py plugins/agent-guard "$RUNNER_TEMP/evidence/default"
          LC_ALL=C AG_NUMERIC_TIME_CHILDREN=1 python3 bench/fused-output/diagnose-numeric.py plugins/agent-guard "$RUNNER_TEMP/evidence/C"
          uname -a > "$RUNNER_TEMP/evidence/platform.txt"
          /bin/sh --version >> "$RUNNER_TEMP/evidence/platform.txt" 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: numeric-locale-${{ matrix.os }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
