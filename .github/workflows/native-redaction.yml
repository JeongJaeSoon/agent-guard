name: Unreaped probe regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Prepare known tools and original source
        run: |
          sh scripts/install-native-test-tools.sh "$RUNNER_TEMP/test-bin"
          mkdir -p "$RUNNER_TEMP/before" "$RUNNER_TEMP/evidence"
          git archive 10cc80c89d6c616616ce2a3642c0e362bdec52ba plugins/agent-guard | tar -x -C "$RUNNER_TEMP/before"
      - name: Prove old failure and new verdicts with unchanged deadlines
        run: |
          export PATH="$RUNNER_TEMP/test-bin:$PATH"
          status=0
          PROBE_ZOMBIE_SOURCE="$RUNNER_TEMP/before/plugins/agent-guard/bin/agent-guard" \
            sh tests/gitleaks-probe-zombie.sh > "$RUNNER_TEMP/evidence/before.log" 2>&1 || status=$?
          if grep -q '# child state before deadline: .*Z' "$RUNNER_TEMP/evidence/before.log"; then
            test "$status" = 1
            grep -Fx '2 passed, 2 failed' "$RUNNER_TEMP/evidence/before.log"
          else
            # Some systems reap an exited child despite the stopped parent.
            # Keep the same expected ready/failed/live-child outcomes there.
            test "$status" = 0
            grep -Fx '4 passed, 0 failed' "$RUNNER_TEMP/evidence/before.log"
          fi
          sh tests/gitleaks-probe-zombie.sh > "$RUNNER_TEMP/evidence/after.log" 2>&1
          sh tests/gitleaks-probe-completion.sh > "$RUNNER_TEMP/evidence/reaped.log" 2>&1
          sh tests/gitleaks-resolution.sh > "$RUNNER_TEMP/evidence/resolution.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unreaped-probe-${{ matrix.os }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
