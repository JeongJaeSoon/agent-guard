name: Scanner process diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnosis:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare exact scanner and current core
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 build --release --locked --manifest-path native/redaction-core/Cargo.toml
          sh scripts/install-native-test-tools.sh "$RUNNER_TEMP/test-bin"
      - name: Collect fixed idle and pressure samples without retry acceptance
        run: |
          export PATH="$RUNNER_TEMP/test-bin:$PATH"
          python3 bench/fused-output/diagnose-process.py \
            --scanner "$RUNNER_TEMP/test-bin/gitleaks" \
            --core "$PWD/native/redaction-core/target/release/agent-guard-redact" \
            --out "$RUNNER_TEMP/process-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scanner-process-${{ matrix.os }}
          path: ${{ runner.temp }}/process-evidence/
          if-no-files-found: error
