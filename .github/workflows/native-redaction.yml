name: Readiness timeout diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: sh scripts/install-native-test-tools.sh "$RUNNER_TEMP/test-bin"
      - name: Single fixed diagnostic sequence
        run: |
          export PATH="$RUNNER_TEMP/test-bin:/usr/bin:/bin:/usr/sbin:/sbin"
          python3 bench/fused-output/diagnose-readiness.py --scanner "$RUNNER_TEMP/test-bin/gitleaks" --out "$RUNNER_TEMP/diagnosis"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: readiness-${{ matrix.os }}
          path: ${{ runner.temp }}/diagnosis
          if-no-files-found: error
