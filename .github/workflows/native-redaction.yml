name: Fixed null control under CPU quota
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Preserve exact Homebrew scanner
        run: |
          mkdir "$RUNNER_TEMP/scanner"
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          HOMEBREW_NO_AUTO_UPDATE=1 brew install gitleaks
          installed="$(brew --prefix gitleaks)/bin/gitleaks"
          test "$("$installed" version)" = 8.30.1
          bottle=$(brew --cache gitleaks)
          printf '%s  %s\n' 78b43afdf14a05c5df07b73aeaf63ae56b784c905f057411a43ee8fde40fe5d1 "$bottle" | sha256sum -c - > "$RUNNER_TEMP/scanner/bottle-checksum.txt"
          cp "$installed" "$RUNNER_TEMP/scanner/gitleaks"
          cmp "$installed" "$RUNNER_TEMP/scanner/gitleaks"
          sha256sum "$RUNNER_TEMP/scanner/gitleaks" > "$RUNNER_TEMP/scanner/binary.sha256"
          brew info --json=v2 gitleaks > "$RUNNER_TEMP/scanner/homebrew.json"
          cp "$(brew --prefix gitleaks)/sbom.spdx.json" "$RUNNER_TEMP/scanner/homebrew-sbom.json"
      - name: Run preregistered controls and CPU placement contrast
        run: sh bench/fused-output/null-control.sh "$RUNNER_TEMP/scanner/gitleaks" "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: null-control-homebrew-off
          path: |
            ${{ runner.temp }}/evidence/
            ${{ runner.temp }}/scanner/binary.sha256
            ${{ runner.temp }}/scanner/bottle-checksum.txt
            ${{ runner.temp }}/scanner/homebrew.json
            ${{ runner.temp }}/scanner/homebrew-sbom.json
          if-no-files-found: error
