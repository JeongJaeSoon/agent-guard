name: Public version evidence export
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
    paths:
      - '.github/workflows/public-version-export.yml'
      - 'bench/results/public-versions-20261106/runtime/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: public-version-export-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'public-version-export'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify and compact the existing installation artifact without measurements
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/source-artifact"
          gh api repos/JeongJaeSoon/agent-guard/actions/artifacts/13504968499 > "$RUNNER_TEMP/source-artifact/metadata.json"
          gh api repos/JeongJaeSoon/agent-guard/actions/artifacts/13504968499/zip > "$RUNNER_TEMP/source-artifact/original.zip"
          python3 bench/results/public-versions-20261106/runtime/compact-export.py --archive "$RUNNER_TEMP/source-artifact/original.zip" --metadata "$RUNNER_TEMP/source-artifact/metadata.json" --out "$RUNNER_TEMP/compact-installation-evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: public-version-installation-compact-linux
          path: ${{ runner.temp }}/compact-installation-evidence/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
