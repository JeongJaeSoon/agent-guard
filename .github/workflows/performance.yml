name: Performance evidence
# Complete threshold failures warn; missing/invalid measurements block release.
# It lives apart from native-platforms.yml so a
# nightly run never adds a `Native platform artifacts` check to a main commit.
on:
  schedule:
    - cron: '23 17 * * *'
  workflow_dispatch:
  # Every pull request, so the shell instruction count exists on each one and
  # can be a required check. .github/scripts/performance-scope.sh decides
  # what a pull request measures: release PRs always bump plugin.json, so they
  # measure the exact tree they release.
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Only the packaged jobs depend on this; the shell instruction count decides
  # for itself, so a failed scope cannot skip a required check into success.
  scope:
    name: Performance evidence scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      packaged: ${{ steps.pick.outputs.packaged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # A pull request checks out its merge commit; its first parent is
          # the base, so the two commits give the pull request's changes.
          fetch-depth: 2
      - name: Choose the measurements
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = pull_request ]; then
            git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          else
            : > "$RUNNER_TEMP/changed"
          fi
          sh .github/scripts/performance-scope.sh "$EVENT_NAME" < "$RUNNER_TEMP/changed" >> "$GITHUB_OUTPUT"

  build:
    name: Linux musl core
    needs: scope
    if: needs.scope.outputs.packaged == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        timeout-minutes: 5
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target x86_64-unknown-linux-musl
      - name: Refresh Linux package metadata
        timeout-minutes: 4
        run: |
          sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
            -o DPkg::Lock::Timeout=30 update --error-on=any
      - name: Install Linux musl tools
        timeout-minutes: 4
        run: |
          sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
            -o DPkg::Lock::Timeout=30 install -y musl-tools
      - name: Build and execute the packaged core
        run: |
          sh scripts/build-native-artifact.sh x86_64-unknown-linux-musl "$RUNNER_TEMP/artifacts"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error

  # Runs on every event, so it can be a required check. A pull request whose
  # changes cannot reach the measured path passes at once and says so; every
  # other run measures. Wall-clock jobs dilute a shell
  # regression with gitleaks and jq time (#505
  # added 21% shell work to dense-controls but about +3% latency), so this job
  # counts the shell's own instructions against the latest release tag. It
  # fails when an event's change beyond the script-size share exceeds 5% of
  # the release, or when it could not measure. The PR-time Hook instruction
  # count job reports base-versus-merge-parent numbers without failing.
  instruction-count:
    name: Shell instruction count against the latest release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          path: head
      # Same decision as the scope job, made here so this job never depends on
      # another one. A diff that cannot run fails the job.
      - name: Decide whether the change reaches the measured path
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = pull_request ]; then
            git -C head -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          else
            : > "$RUNNER_TEMP/changed"
          fi
          sh head/.github/scripts/performance-scope.sh "$EVENT_NAME" < "$RUNNER_TEMP/changed" > "$RUNNER_TEMP/scope"
          cat "$RUNNER_TEMP/scope" >> "$GITHUB_OUTPUT"
          if grep -Fxq instruction_count=false "$RUNNER_TEMP/scope"; then
            printf '### Shell instruction count against the latest release\n\n측정하지 않고 통과합니다: 이 PR은 측정 경로(%s의 instruction_count 목록)에 닿는 파일을 바꾸지 않았습니다.\n' \
              '.github/scripts/performance-scope.sh' >> "$GITHUB_STEP_SUMMARY"
          fi
      # The newest release tag reachable from the measured commit, other than
      # one on that commit itself; a fork or checkout without tags fails here.
      - name: Check out the latest release tag
        id: base
        if: steps.scope.outputs.instruction_count == 'true'
        run: |
          head_sha=$(git -C head rev-parse HEAD)
          tag=
          for candidate in $(git -C head tag --merged HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname); do
            [ "$(git -C head rev-parse "$candidate^{commit}")" != "$head_sha" ] || continue
            tag=$candidate
            break
          done
          if [ -z "$tag" ]; then
            echo '::error title=Shell instruction count::No release tag is reachable from the measured commit.'
            false
          fi
          git -C head worktree add --detach ../base "$tag"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - name: Refresh Linux package metadata
        if: steps.scope.outputs.instruction_count == 'true'
        timeout-minutes: 4
        run: |
          sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
            -o DPkg::Lock::Timeout=30 update --error-on=any
      # The mirror has served valgrind and the glibc packages it pulls in
      # (35.5 MB) at about 50 kB/s, which no retry inside the 4-minute step can
      # finish, so the packages are cached. The key is the exact list of
      # package URIs apt plans to fetch on this runner, so a new runner image or
      # package version makes a new key; an older cache still seeds the apt
      # archive and only changed files are fetched.
      - name: Plan valgrind packages
        id: plan
        if: steps.scope.outputs.instruction_count == 'true'
        run: |
          uris="$RUNNER_TEMP/valgrind-uris"
          sudo apt-get -o DPkg::Lock::Timeout=30 install -qq --print-uris --no-install-recommends valgrind > "$uris"
          printf 'key=valgrind-debs-%s-%s-%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$(sha256sum "$uris" | cut -c1-16)" >> "$GITHUB_OUTPUT"
          mkdir -p "$HOME/valgrind-debs"
      - name: Restore valgrind packages
        id: restore
        if: steps.scope.outputs.instruction_count == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/valgrind-debs
          key: ${{ steps.plan.outputs.key }}
          restore-keys: valgrind-debs-${{ runner.os }}-${{ runner.arch }}-
      # A download that stops is retried: each attempt keeps the shared
      # fail-fast options (Retries=0, 20 s timeouts), gets its own 55 s limit
      # and resumes the partial file (apt sends a Range request), three attempts
      # at most inside the unchanged step limit. Only the download is retried
      # and killed: stopping apt during dpkg could leave the next attempt a
      # broken package state. A runner that never gets valgrind still fails the
      # job as "could not measure".
      - name: Download valgrind
        if: steps.scope.outputs.instruction_count == 'true'
        timeout-minutes: 4
        run: |
          if ls "$HOME"/valgrind-debs/*.deb > /dev/null 2>&1; then
            sudo cp "$HOME"/valgrind-debs/*.deb /var/cache/apt/archives/
          fi
          fetched=no
          for attempt in 1 2 3; do
            if sudo timeout --kill-after=5 55 apt-get -o Acquire::Retries=0 \
                -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
                -o DPkg::Lock::Timeout=30 install -y --no-install-recommends --download-only valgrind; then
              fetched=yes
              break
            fi
            echo "::warning title=Shell instruction count::valgrind download attempt $attempt did not finish; retrying up to 3 attempts."
            [ "$attempt" = 3 ] || sleep 10
          done
          [ "$fetched" = yes ]
          awk '{ print $2 }' "$RUNNER_TEMP/valgrind-uris" | while read -r deb; do
            cp "/var/cache/apt/archives/$deb" "$HOME/valgrind-debs/"
          done
      - name: Save valgrind packages
        if: steps.scope.outputs.instruction_count == 'true' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/valgrind-debs
          key: ${{ steps.plan.outputs.key }}
      - name: Install valgrind
        if: steps.scope.outputs.instruction_count == 'true'
        timeout-minutes: 4
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=30 install -y --no-install-recommends --no-download valgrind
      - name: Count and gate the release and head shell instructions
        id: count
        if: steps.scope.outputs.instruction_count == 'true'
        env:
          BASE_TAG: ${{ steps.base.outputs.tag }}
          EVIDENCE_JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          out="$RUNNER_TEMP/instruction-count"
          mkdir -p "$out"
          trap 'cat "$out/errors.txt" >&2' EXIT
          tsv="$out/instruction-count.tsv"
          started=$(date +%s)
          status=0
          printf 'measurement_error\n' > "$out/verdict.txt"
          : > "$out/errors.txt"
          sh head/.github/scripts/write-performance-source.sh "$out" 2>> "$out/errors.txt"
          sh head/bench/instruction-count/run.sh base head "$tsv" 2> "$out/errors.txt" || status=$?
          elapsed=$(( $(date +%s) - started ))
          {
            printf '### Shell instruction count against the latest release\n\n'
            printf -- '- base: 릴리스 태그 `%s`(`%s`), head: `%s`\n' \
              "$BASE_TAG" "$(git -C base rev-parse HEAD)" "$(git -C head rev-parse HEAD)"
            printf -- '- /bin/sh: `%s`, %s\n' "$(readlink -f /bin/sh)" "$(valgrind --version 2>/dev/null || printf 'valgrind missing')"
            printf -- '- 측정 시간: %s초(두 트리, 이벤트 6개, 각 1회)\n\n' "$elapsed"
          } > "$out/summary.md"
          if [ "$status" -ne 0 ]; then
            printf '측정하지 못했습니다(종료 코드 %s). 변화 없음이라는 뜻이 아닙니다.\n' "$status" >> "$out/summary.md"
            cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
            false
          fi
          sh head/bench/instruction-count/run.sh --render "$tsv" >> "$out/summary.md" 2>> "$out/errors.txt"
          gate=0
          sh head/bench/instruction-count/run.sh --check "$tsv" 5 > "$out/over-limit.txt" 2>> "$out/errors.txt" || gate=$?
          case "$gate" in
            0) printf 'passed\n' > "$out/verdict.txt" ;;
            1) printf 'threshold_exceeded\n' > "$out/verdict.txt" ;;
          esac
          {
            printf '\n'
            case "$gate" in
              0) printf '판정: 통과. 어떤 이벤트도 스크립트 크기 몫을 뺀 나머지가 릴리스의 +5%%를 넘지 않았습니다.\n' ;;
              1) printf '판정: **실패**. 스크립트 크기 몫을 뺀 나머지가 릴리스의 +5%%를 넘은 이벤트:\n\n'
                 sed 's/^/- /' "$out/over-limit.txt" ;;
              *) printf '판정: 측정이 완전하지 않습니다(종료 코드 %s: 빠진 값, 또는 base와 head에서 hook 종료 코드가 다름. job 로그 참고). 변화 없음이라는 뜻이 아닙니다.\n' "$gate" ;;
            esac
            printf '\n- 셸(dash)이 실행한 명령어 수입니다. native 출력 redactor 없이 셸 경로만 재고, gitleaks·jq 시간은 세지 않습니다.\n'
            printf -- '- 릴리스 사이에 +5%% 미만으로 쌓이는 증가는 잡지 못합니다. 기능 추가로 일이 실제로 늘어도 실패하며, 그때는 유지관리자가 판단합니다.\n'
          } >> "$out/summary.md"
          cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$out/summary.md"
          [ "$gate" -eq 0 ]
      - name: Report a run that never reached the measurement
        if: failure() && steps.count.outcome == 'skipped'
        env:
          EVIDENCE_JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          mkdir -p "$RUNNER_TEMP/instruction-count"
          printf 'measurement_error\n' > "$RUNNER_TEMP/instruction-count/verdict.txt"
          printf 'Measurement setup failed before instruction counting\n' > "$RUNNER_TEMP/instruction-count/errors.txt"
          if [ -f head/.github/scripts/write-performance-source.sh ]; then
            sh head/.github/scripts/write-performance-source.sh "$RUNNER_TEMP/instruction-count" 2>> "$RUNNER_TEMP/instruction-count/errors.txt"
          fi
          printf '### Shell instruction count against the latest release\n\n측정하지 못했습니다: 측정 전 단계(checkout·릴리스 태그·valgrind 설치)가 실패했습니다. 이 job의 로그를 확인하세요. 변화 없음이라는 뜻이 아닙니다.\n' \
            | tee -a "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/instruction-count/summary.md"
      # Every run except a pull request that was found not to need one.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.scope.outputs.instruction_count != 'false'
        with:
          name: instruction-count
          path: ${{ runner.temp }}/instruction-count/
          if-no-files-found: warn

  # A screened 5% regression must also repeat in a 21-pair confirmation
  # (bench/native/confirm.jq) before a job fails.
  performance:
    name: Packaged performance evidence
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/native-performance
      - name: Measure the packaged binary under enforced cgroup limits
        env:
          EVIDENCE_JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          set -uo pipefail
          errors="$RUNNER_TEMP/packaged-errors.txt"
          status=0
          measure() {
          mkdir -p plugins/agent-guard/libexec
          cp "$RUNNER_TEMP/native-performance/agent-guard-redact-x86_64-unknown-linux-musl"* plugins/agent-guard/libexec/
          chmod 755 plugins/agent-guard/libexec/agent-guard-redact-x86_64-unknown-linux-musl
          sh scripts/install-native-test-tools.sh "$RUNNER_TEMP/test-bin"
          sh bench/native/run-packaged.sh "$RUNNER_TEMP/test-bin/gitleaks" 9a0ee9eb2eed1e60b78d4404f985b077149c675d "$RUNNER_TEMP/performance"
          }
          # Run in a fresh errexit shell so a failed setup cannot fall through.
          export -f measure
          bash -e -c measure 2> "$errors" || status=$?
          mkdir -p "$RUNNER_TEMP/performance"
          [ -f "$RUNNER_TEMP/performance/verdict.txt" ] || printf 'measurement_error\n' > "$RUNNER_TEMP/performance/verdict.txt"
          if ! sh .github/scripts/write-performance-source.sh "$RUNNER_TEMP/performance" 2>> "$errors"; then
            printf 'measurement_error\n' > "$RUNNER_TEMP/performance/verdict.txt"
            status=2
          fi
          cat "$errors" > "$RUNNER_TEMP/performance/errors.txt"
          for log in "$RUNNER_TEMP/performance"/cli-*.log "$RUNNER_TEMP/performance"/*confirm*.log; do
            if [ -f "$log" ]; then
              printf '\n%s:\n' "${log##*/}" >> "$RUNNER_TEMP/performance/errors.txt"
              cat "$log" >> "$RUNNER_TEMP/performance/errors.txt"
            fi
          done
          cat "$RUNNER_TEMP/performance/errors.txt" >&2
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: packaged-performance
          path: ${{ runner.temp }}/performance/
          if-no-files-found: error

  # Group only the same failure cause; a different cause opens a new issue.
  notify:
    name: Nightly performance issue
    if: >-
      always() && github.event_name == 'schedule'
      && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped'))
    needs: [build, instruction-count, performance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # Without the body script the issue still opens with a short body.
        continue-on-error: true
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Download measurement evidence
        # A missing artifact must not suppress the issue; the body says so.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: '*packaged*'
          path: ${{ runner.temp }}/evidence
      - name: Download the shell instruction count
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: instruction-count
          path: ${{ runner.temp }}/evidence/instruction-count
      - name: Open or update the nightly performance issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          # Issues are tickets, which this repository writes in Korean (AGENTS.md).
          TITLE: nightly 성능 측정이 통과하지 못했습니다
        run: |
          jobs="$RUNNER_TEMP/run-jobs.json"
          # A partial re-run keeps the earlier result of jobs it did not
          # re-run, so judge each job by its latest attempt across the run.
          if gh api --paginate --slurp "repos/$REPO/actions/runs/$RUN_ID/jobs?filter=all&per_page=100" > "$jobs" \
            && failed=$(jq -r '
              [.[].jobs[]] | group_by(.name) | map(max_by(.run_attempt))[]
              | select(.name != "Nightly performance issue" and .conclusion != "success")
              | "- \(.name): \(.conclusion // "unfinished")"' "$jobs"); then
            :
          else
            failed='- 이 run의 job 결론을 읽지 못했습니다.'
          fi
          mkdir -p "$RUNNER_TEMP/evidence"
          cp "$jobs" "$RUNNER_TEMP/evidence/jobs.json"
          body="$RUNNER_TEMP/issue.md"
          if ! sh .github/scripts/performance-issue-body.sh "$RUNNER_TEMP/evidence" "$failed" > "$body"; then
            printf '%s\n' "nightly run: $RUN_URL" "커밋: $HEAD_SHA" '' \
              '이슈 본문을 만들지 못했습니다. run 로그와 artifact를 확인하세요.' '' \
              '통과하지 못한 job(최신 attempt):' '' "$failed" > "$body"
          fi
          if ! cause=$(sh .github/scripts/performance-cause.sh "$RUNNER_TEMP/evidence" "$failed"); then
            cause=$(printf '%s\n' "$failed" | shasum -a 256 | cut -d ' ' -f1)
          fi
          marker="<!-- agent-guard-performance-cause:$cause -->"
          printf '\n%s\n' "$marker" >> "$body"
          oldest_open_issue() {
            # Command substitution drops -e in bash, so fail explicitly.
            gh api --paginate --slurp "repos/$REPO/issues?state=open&per_page=100" > "$RUNNER_TEMP/open-issues.json" || return 1
            jq -r --arg title "$TITLE" --arg marker "$marker" '
              [.[][] | select(.pull_request == null and .title == $title
                              and (.body // "" | contains($marker))
                              and .user.login == "github-actions[bot]")]
              | sort_by(.number) | first | .number // empty' "$RUNNER_TEMP/open-issues.json"
          }
          number=$(oldest_open_issue)
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body-file "$body"
          else
            created=$(gh issue create --repo "$REPO" --title "$TITLE" --body-file "$body")
            created=${created##*/}
            # Overlapping runs (a re-run next to a nightly) can each find no
            # issue and open one. A run folds its issue only into a smaller
            # number, so lagging listings can never close the oldest one.
            number=$(oldest_open_issue)
            case "$created:$number" in
              *[!0-9:]*|:*|*:) number='' ;;
            esac
            if [ -n "$number" ] && [ "$number" -lt "$created" ]; then
              gh issue comment "$number" --repo "$REPO" --body-file "$body"
              gh issue close "$created" --repo "$REPO" --reason 'not planned' --comment "#$number 와 중복이라 닫습니다."
            fi
          fi
